name: bloom-content
version: 1.2.0
description: "Restricted Bloom API client for drafts, WebP media, first-pass reviews, and reviewed monetization proposals."
author: Expansao AI
kind: extension
requires_env:
  - BLOOM_API_URL
  - BLOOM_CONTENT_API_TOKEN
provides_tools:
  - bloom_context
  - bloom_check_topic
  - bloom_monetization_backlog
  - bloom_build_affiliate_search
  - bloom_propose_monetization
  - bloom_editorial_review_backlog
  - bloom_submit_editorial_review
  - bloom_upload_media
  - bloom_create_draft
