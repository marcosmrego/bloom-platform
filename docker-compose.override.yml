version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bloom-postgres
    environment:
      POSTGRES_DB: bloom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  bloom-api:
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=bloom
      - DB_USER=postgres
      - DB_PASSWORD=example_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
