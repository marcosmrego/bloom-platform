version: '3.8'

services:
  bloom-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bloom-api
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=212.85.22.227
      - DB_PORT=5432
      - DB_NAME=bloom
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  bloom-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bloom-frontend
    ports:
      - "3001:3000"
    environment:
      - BLOOM_API=http://bloom-api:8000
      - PORT=3000
    depends_on:
      - bloom-api
    restart: unless-stopped
