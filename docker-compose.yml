version: '3.8'

services:
  bloom-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bloom-api
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
      - DB_NAME=bloom
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  bloom-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bloom-frontend
    ports:
      - "3001:3000"
    environment:
      - BLOOM_API=http://bloom-api:8000
      - BLOOM_TENANT=${BLOOM_TENANT:-}
      - PORT=3000
    depends_on:
      - bloom-api
    restart: unless-stopped
